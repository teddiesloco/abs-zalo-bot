name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Validate public configuration
        run: npm run validate-config

      - name: Scan public files
        run: npm run secret-scan

      - name: Check JavaScript syntax
        run: npm run syntax-check

      - name: Run offline self-check
        run: npm run self-check
